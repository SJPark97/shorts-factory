name: Build & Release

on:
  push:
    tags:
      - "v*"          # v1.0.0 같은 태그 push 시 릴리즈 빌드
  workflow_dispatch:  # 수동 실행 버튼

permissions:
  contents: write     # GitHub Release 생성 권한

jobs:
  # ── Mac 빌드 ──────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: FFmpeg 설치
        run: |
          brew install ffmpeg
          mkdir -p assets/ffmpeg
          cp $(which ffmpeg) assets/ffmpeg/ffmpeg
          cp $(which ffprobe) assets/ffmpeg/ffprobe
          chmod +x assets/ffmpeg/ffmpeg assets/ffmpeg/ffprobe

      - name: PyInstaller 빌드
        run: pyinstaller shorts.spec --clean --noconfirm

      - name: DMG 생성
        run: |
          hdiutil create \
            -volname "쇼츠자동양산기" \
            -srcfolder "dist/쇼츠자동양산기.app" \
            -ov -format UDZO \
            "dist/쇼츠자동양산기-mac.dmg"

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/쇼츠자동양산기-mac.dmg

  # ── Windows 빌드 ──────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: FFmpeg 다운로드
        shell: powershell
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $zip = "ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "ffmpeg_extracted" -Force
          New-Item -ItemType Directory -Force -Path "assets/ffmpeg"
          $bin = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $bin.FullName "assets/ffmpeg/ffmpeg.exe"
          $bin2 = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $bin2.FullName "assets/ffmpeg/ffprobe.exe"

      - name: PyInstaller 빌드
        run: pyinstaller shorts.spec --clean --noconfirm

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/쇼츠자동양산기.exe

  # ── GitHub Release 생성 ───────────────────────────────────────────
  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Mac DMG 다운로드
        uses: actions/download-artifact@v4
        with:
          name: mac-dmg
          path: dist/

      - name: Windows EXE 다운로드
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist/

      - name: GitHub Release 생성
        uses: softprops/action-gh-release@v2
        with:
          name: "쇼츠 자동 양산기 ${{ github.ref_name }}"
          body: |
            ## 설치 방법

            | OS | 파일 | 설치 |
            |---|---|---|
            | Mac | `쇼츠자동양산기-mac.dmg` | DMG 열고 앱 드래그 |
            | Windows | `쇼츠자동양산기.exe` | 바로 실행 |

            > FFmpeg가 앱 안에 포함되어 있어 별도 설치 불필요.
          files: |
            dist/쇼츠자동양산기-mac.dmg
            dist/쇼츠자동양산기.exe
